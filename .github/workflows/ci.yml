name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs for the same PR / branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (from the lock file)
        run: uv sync --locked

      - name: Run tests (includes the OpenAPI contract freshness check)
        run: uv run pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # current LTS (local dev may use a newer non-LTS release)
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (from the lock file)
        run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: API types match the backend contract
        run: |
          npm run gen:api
          if ! git diff --exit-code -- src/api/schema.gen.ts; then
            echo "::error file=frontend/src/api/schema.gen.ts::Generated API types are out of date. Run 'npm run gen:api' in frontend/ and commit the result."
            exit 1
          fi
